<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>B · 紧凑列表 — 解析历史示例</title>
  <link rel="stylesheet" href="preview.css">
  <script src="preview.js" defer></script>
</head>
<body data-layout="compact">
  <header class="topbar">
    <h1>解析历史</h1>
    <nav class="variants" aria-label="效果示例">
      <a href="a-panel.html">A · 面板排列</a>
      <a href="b-compact.html" aria-current="page">B · 紧凑列表</a>
      <a href="c-sidebar.html">C · 日期侧栏</a>
    </nav>
    <label class="theme-label">外观<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="日期导航"><h2>日期</h2><div id="dates"></div></aside>
    <main>
      <form class="toolbar" role="search">
        <label class="date-field">日期<select id="day"></select></label>
        <label class="search"><input id="search" type="search" placeholder="搜索当天内容" aria-label="搜索当天内容" autocomplete="off"></label>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div id="entries"></div>
      <footer>仅用于比较布局。全部为虚构示例，不连接真实历史。<br>B：去掉外框，扩大可读宽度，用细分隔线紧凑排列。</footer>
    </main>
  </div>
</body>
