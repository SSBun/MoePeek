<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英语复习 · MoePeek</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="stylesheet" href="/history.css">
  <script src="/history.js" defer></script>
</head>
<body>
  <main>
    <header><h1>翻译与解析历史</h1><span class="local">MoePeek · 仅在本机</span></header>
    <div class="workspace">
      <aside class="sidebar" aria-label="日期导航">
        <h2>日期</h2>
        <nav id="dates" aria-label="学习日期"></nav>
      </aside>
      <div class="content">
        <form role="search">
          <label class="date-field">日期<select id="day" disabled><option value="">暂无记录</option></select></label>
          <label class="search"><input id="search" type="search" placeholder="搜索当天内容" aria-label="搜索当天内容" autocomplete="off" disabled></label>
          <label>外观<select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label>
          <button type="button" id="refresh">刷新记录</button>
        </form>
        <p id="status" role="status" aria-live="polite">正在读取历史记录…</p>
        <section id="entries" aria-label="翻译与解析记录"></section>
        <button type="button" id="more" hidden>继续阅读</button>
        <footer>记录保存在本机。无纠错、无改写的检查结果不记录、不展示；点击垃圾桶并确认可永久删除单条记录及其收藏、学习状态。</footer>
      </div>
    </div>
  </main>
</body>
</html>
